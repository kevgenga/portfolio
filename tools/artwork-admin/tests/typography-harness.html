<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;display:block}</style><iframe id="site" height="1300"></iframe><pre id="results">Pending</pre>
<script>
const frame=document.getElementById('site'),results=[],errors=[],params=new URLSearchParams(location.search);
const widths=[320,375,390,430,768,1024,1280,1440,1920],locales=['en','fr','ja'],themes=['light','dark'],routes=['','mangaka','illustration','contact'];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(fn){for(let i=0;i<300;i++){if(fn())return;await wait(30);}throw Error('Render timeout');}
function load(url){return new Promise(resolve=>{frame.onload=resolve;frame.src=url;});}
const colorContexts=new WeakMap();
function rgba(value,doc){let ctx=colorContexts.get(doc);if(!ctx){ctx=doc.createElement('canvas').getContext('2d',{willReadFrequently:true});colorContexts.set(doc,ctx);}ctx.clearRect(0,0,1,1);ctx.fillStyle=value;ctx.fillRect(0,0,1,1);const c=[...ctx.getImageData(0,0,1,1).data];return [c[0],c[1],c[2],c[3]/255];}
function blend(f,b){return f.slice(0,3).map((v,i)=>v*f[3]+b[i]*(1-f[3]));}
function contrast(f,b){const lum=c=>c.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);const a=lum(f),d=lum(b);return (Math.max(a,d)+.05)/(Math.min(a,d)+.05);}
function audit(doc,win){
const samples=[],clipped=[],overlaps=[],small=[],badContrast=[],splitWords=[];
const selectors='[aria-labelledby="sketchbook-title"] h2+p,[aria-labelledby="sketchbook-title"] [role="status"] p,.contact-display__title,.contact-display>p,.contact-display span,.contact-form-panel label,.contact-form-panel button,.manga-card__description,.manga-card__meta,.manga-card__pages,.manga-card__title,.filter-button,.filter-button span,.page-introduction,.page-title,.section-title,.section-eyebrow,.section-label__text,.section-label__note,.page-kicker,.hero-art-card__title,.hero-art-card__description,.about-hero__summary,.about-hero__roles,.about-hero__meta,.home-cta,.home-text-link,.professional-status p,.portfolio-footer h2,.portfolio-footer h3,.portfolio-footer li,.portfolio-footer a,.portfolio-footer__period,.portfolio-footer__copyright,.portfolio-footer__roles,.artwork-card__metadata p,.nav-link,#mobile-navigation a,#mobile-navigation button,.fancybox__caption,.recognition-entry h3,.recognition-entry > div > p,.recognition-seal__award,.recognition-seal__distinction,.manga-section-heading h2,.manga-section-heading p';
for(const el of doc.querySelectorAll(selectors)){
 if(!el.textContent.trim()||el.closest('[aria-hidden="true"]'))continue;const css=win.getComputedStyle(el);if(css.display==='none')continue;
 const range=doc.createRange();range.selectNodeContents(el);const rects=[...range.getClientRects()].filter(r=>r.width>0&&r.height>0),box=el.getBoundingClientRect();if(!rects.length)continue;
 const chain=[];for(let p=el;p;p=p.parentElement)chain.push(p);let bg=[255,255,255];for(const p of [...chain].reverse())bg=blend(rgba(win.getComputedStyle(p).backgroundColor,doc),bg);
 let alpha=Number(css.opacity);for(const p of chain.slice(1)){const s=win.getComputedStyle(p);if(!p.getAnimations().length)alpha*=Number(s.opacity);}
 const color=rgba(css.color,doc);color[3]*=alpha;const ratio=contrast(blend(color,bg),bg),size=parseFloat(css.fontSize),required=size>=24||(size>=18.67&&Number(css.fontWeight)>=700)?3:4.5;
 const sample={selector:el.className||el.tagName,text:el.textContent.trim().slice(0,90),size,lineHeight:css.lineHeight,font:css.fontFamily,color:css.color,background:bg,contrast:ratio,required,width:box.width,height:box.height};samples.push(sample);
 if(ratio<required-.01)badContrast.push(sample);if(doc.documentElement.lang==='ja'&&size<12.9)small.push(sample);
 const intentional=css.webkitLineClamp!=='none'||css.textOverflow==='ellipsis'||el.matches('.hero-art-card__description');
 if(!intentional){
  const parent=el.parentElement.getBoundingClientRect();const padding=win.getComputedStyle(el.parentElement);const left=parent.left+parseFloat(padding.paddingLeft),right=parent.right-parseFloat(padding.paddingRight);
  if(rects.some(r=>r.left<left-2||r.right>right+2))clipped.push({...sample,reason:'text exceeds parent content'});
  for(const p of chain){const s=win.getComputedStyle(p);if(!['hidden','clip','auto'].includes(s.overflowX)&&!['hidden','clip','auto'].includes(s.overflowY))continue;const b=p.getBoundingClientRect();if(rects.some(r=>r.left<b.left-2||r.right>b.right+2||r.top<b.top-2||r.bottom>b.bottom+2)){clipped.push({...sample,reason:'clipping ancestor',ancestor:p.className});break;}}
 }
 if(el.matches('.contact-display__title')){
  const walker=doc.createTreeWalker(el,NodeFilter.SHOW_TEXT),lines=[];while(walker.nextNode()){const node=walker.currentNode;if(!node.textContent.trim())continue;const r=doc.createRange();r.selectNodeContents(node);for(const b of r.getClientRects())if(b.width)lines.push(b);}
  const distinct=lines.filter((r,i)=>!lines.slice(0,i).some(p=>Math.abs(p.top-r.top)<1)).sort((a,b)=>a.top-b.top);
  if(distinct.some((r,i)=>i&&r.top<distinct[i-1].bottom-1))overlaps.push(sample);sample.lines=distinct.length;
 }
 if(el.matches('.page-title,.contact-display__title,.manga-card__title')&&doc.documentElement.lang!=='ja'){
  const walker=doc.createTreeWalker(el,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const node=walker.currentNode;for(const match of node.textContent.matchAll(/[\p{Script=Latin}]+/gu)){const wordRange=doc.createRange();wordRange.setStart(node,match.index);wordRange.setEnd(node,match.index+match[0].length);const rows=[...wordRange.getClientRects()].filter(r=>r.width>1);if(rows.length>1)splitWords.push({...sample,word:match[0]});}}
 }
}
return {samples,clipped,overlaps,small,badContrast,splitWords,scrollWidth:doc.documentElement.scrollWidth,clientWidth:doc.documentElement.clientWidth};
}
(async()=>{
for(const locale of locales)for(const theme of themes)for(const width of widths)for(const route of routes){
localStorage.setItem('portfolio-theme',theme);frame.style.width=width+'px';await load('/portfolio/'+route+'?lang='+locale);await until(()=>frame.contentDocument.querySelector('main')&&frame.contentDocument.documentElement.lang===locale);const doc=frame.contentDocument,win=frame.contentWindow;await wait(150);
// Finish only entrance animations in QA, so offscreen text is measured in its final state.
for(const el of doc.querySelectorAll('main,main section,main article,main header,main>div')){for(const animation of el.getAnimations())try{animation.finish();}catch{}el.style.opacity='1';}
for(const el of doc.querySelectorAll('main [style]'))if(el.style.opacity&&!el.matches('img'))el.style.opacity='1';
const result={locale,theme,width,route:route||'home',...audit(doc,win)};results.push(result);document.getElementById('results').textContent=JSON.stringify({pending:true,stage:{locale,theme,width,route}});
}
document.getElementById('results').textContent=JSON.stringify({results,errors});
})().catch(e=>document.getElementById('results').textContent=JSON.stringify({error:e.message,results,errors}));
</script>
