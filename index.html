    <script>
      (function (location) {
        if (location.search.startsWith("?/")) {
          const route = location.search
            .slice(2)
            .split("&")
            .map((segment) => segment.replace(/~and~/g, "&"))
            .join("?");
          window.history.replaceState(
            null,
            "",
            `${location.pathname}${route}${location.hash}`,
          );
        }
      })(window.location);
    </script>
